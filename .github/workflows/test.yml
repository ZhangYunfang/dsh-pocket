name: Test

# push/PR 时只跑测试，不发版（发版走手动的 Release workflow）
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # 构建产物 client/client.js 是随包发布的；源码改了却没重建会让手机端跑旧代码。
      # CI 里重建后必须零 diff（审计：发版流程此前不校验产物新鲜度）。
      - run: npm run build:client
      - run: git diff --exit-code -- client/client.js
      - run: npm test
